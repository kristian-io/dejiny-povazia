<style>
/* Layout: timeline band across the top; story column on the left, map of the lower Váh on the right. */

  /* drawn historical map */

  --marsh: #c9dccb;

  :root:not([data-theme="light"]) {
    --paper: #121716; --panel: #182020; --ink: #e2e8e4; --muted: #94a39e; --line: #2b3633;
    --accent: #72b9c1; --accent-soft: #1d3436; --mark: #e2735f; --hu: #d0a55e; --sk: #72b9c1; --map-bg: #1d2423;
    --land: #1f2622; --upland: #2f2c22; --marsh: #22332c; --marsh-strong: #2b4237; --water: #6aa7cc; --border: #e07a63; --site: #b896e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121716; --panel: #182020; --ink: #e2e8e4; --muted: #94a39e; --line: #2b3633;
  --accent: #72b9c1; --accent-soft: #1d3436; --mark: #e2735f; --hu: #d0a55e; --sk: #72b9c1; --map-bg: #1d2423;
  --land: #1f2622; --upland: #2f2c22; --marsh: #22332c; --marsh-strong: #2b4237; --water: #6aa7cc; --border: #e07a63; --site: #b896e6;

}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);

}
.app {

}

}

.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Timeline */
.timeline {
  grid-area: time; display: flex; align-items: stretch; gap: 0.5rem;
  border-block: 1px solid var(--line); background: var(--panel);
  padding-block: 0.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.timeline .nav { flex: none; width: 2.2rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; cursor: pointer; font-size: 1.1rem; }

.track { flex: 1; min-width: 0; overflow-x: auto; display: flex; gap: 2px; scrollbar-width: thin; }
.stop {
  flex: 1 0 5.6rem; text-align: left; border: 0; cursor: pointer;

/* Story column */

.rulers { display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 0.9rem; margin: 0; padding: 0.8rem 0; border-block: 1px solid var(--line); }
.rulers dt { font: 500 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-top: 0.2rem; }

.cite { margin-top: 0.3rem; display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
.cite a, .cite span.src { font: 0.68rem var(--font-mono); color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 3px; padding: 0 0.3rem; }
.cite a:hover { color: var(--accent); border-color: var(--accent); }
.conf { font: 0.68rem var(--font-mono); color: var(--hu); }
.census { display: flex; flex-direction: column; gap: 0.45rem; }
.census .row { display: grid; grid-template-columns: 6.5rem 1fr 4.5rem; gap: 0.6rem; align-items: center; font-size: 0.85rem; }

.census .bar span { display: block; height: 100%; }
.census .tot { font: 0.75rem var(--font-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 1rem; font-size: 0.78rem; color: var(--muted); }
.legend i { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px; margin-right: 0.3rem; vertical-align: -0.05rem; }
/* Picture loading: a small spinner until the picture has fully arrived, then a soft fade-in
   (instead of the browser drawing it line by line). Containers get class "ld", and "ready" once loaded. */
.ld { position: relative; }
.ld::before {
  content: ""; position: absolute; top: 50%; left: 50%; z-index: 1; width: 22px; height: 22px; margin: -11px 0 0 -11px;
  border-radius: 50%; border: 2px solid color-mix(in srgb, var(--muted) 28%, transparent); border-top-color: var(--accent);
  animation: ld-spin 0.8s linear infinite; pointer-events: none;
}

.ld img { opacity: 0; transform: scale(1.02); transition: opacity 0.45s ease, transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1); }

/* Pictures: period cover, thumbnail strip, event thumbnails, viewer */

.cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 400ms ease; }
.cover.ready:hover img { transform: scale(1.02); }
.cover figcaption { position: absolute; inset: auto 0 0 0; padding: 1.6rem 0.75rem 0.5rem; font-size: 0.78rem; line-height: 1.3; color: #f4f1ea;
  background: linear-gradient(transparent, rgb(0 0 0 / 0.68)); }

/* AI pictures are always marked: corner badge and dashed outline, never mistaken for archival photos */
.cover.ai::after { content: "AI"; position: absolute; top: 0.5rem; left: 0.5rem; font: 600 0.68rem var(--font-mono); letter-spacing: 0.08em;
  color: #fff; background: rgb(107 63 160 / 0.85); padding: 0.1rem 0.4rem; border-radius: 3px; }
.cover.ai, .strip button.ai, .ev-thumb.ai { outline: 2px dashed var(--site); outline-offset: -2px; }
.strip { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.2rem; scrollbar-width: thin; margin-top: 0.5rem; }
.strip button { flex: none; padding: 0; border: 0; border-radius: 4px; overflow: hidden; cursor: zoom-in; background: var(--line); height: 3.6rem; }
.strip img { height: 100%; width: auto; display: block; }
.strip-more { display: block; margin-top: 0.35rem; font-size: 0.78rem; color: var(--muted); text-decoration: none; }
.strip-more a { color: inherit; }

.ev-thumb { float: right; margin: 0.15rem 0 0.3rem 0.7rem; width: 4.2rem; height: 3.2rem; padding: 0; border: 0; border-radius: 4px; overflow: hidden; cursor: zoom-in; background: var(--line); }
.ev-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-pin { cursor: pointer; }
.photo-pin circle { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; }
.photo-pin path { fill: var(--ink); }
.photo-pin:hover circle { fill: var(--accent-soft); stroke: var(--accent); }

  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }

.lb-stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }

.lb-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 1px solid rgb(255 255 255 / 0.25);

.lb-prev { left: 0; } .lb-next { right: 0; }

.lb-btn:disabled { opacity: 0.25; cursor: default; }

/* "Hlas doby": a real, sourced voice from the period – a quiet card, set apart from the event list */
.voice { position: relative; margin: 0; padding: 0.9rem 1rem 0.85rem 2.6rem; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.voice::before { content: "E"; position: absolute; left: 0.7rem; top: 0.1rem; font: 700 2.6rem/1 var(--font-display); color: var(--hu); opacity: 0.8; }
.voice.story::before { content: "º6"; font-size: 1.1rem; top: 0.95rem; left: 0.95rem; }

.voice .v-who { margin-top: 0.45rem; font-size: 0.8rem; color: var(--muted); }

.voice .ev-thumb { margin-top: 0; }
.voices { display: flex; flex-direction: column; gap: 0.6rem; }

/* Wikipedia terms: dotted, not blue. First mention on a page is visible, later ones barely there */
.wl { color: inherit; text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 0.22em;
  text-decoration-color: color-mix(in srgb, var(--muted) 30%, transparent); cursor: pointer; }
span.wl { -webkit-tap-highlight-color: transparent; }
span.wl:focus:not(:focus-visible) { outline: none; }
.wl.first { text-decoration-color: color-mix(in srgb, var(--accent) 80%, transparent); text-decoration-thickness: 1.5px; }
.wl:hover, .wl:focus-visible, .wl[aria-expanded="true"] { color: var(--accent); text-decoration-color: var(--accent); }
.wpop {
  position: fixed; z-index: 20; box-sizing: border-box; width: min(22rem, calc(100vw - 32px));
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 10px 30px rgb(0 0 0 / 0.18); padding: 0.8rem 0.9rem; font-size: 0.88rem; line-height: 1.45;
}
.wpop .wimg { float: right; width: 72px; height: 72px; border-radius: 4px; overflow: hidden; margin: 0 0 0.4rem 0.7rem; background: var(--line); }
.wpop .wimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wpop h4 { margin: 0 0 0.3rem; font: 600 1rem var(--font-body); }
.wpop p { margin: 0; }
.wpop footer { clear: both; display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-top: 0.65rem; padding-top: 0.5rem; border-top: 1px solid var(--line); }
.wpop footer span { font: 0.7rem var(--font-mono); color: var(--muted); }
.wpop footer a { color: var(--accent); font-weight: 600; text-decoration: none; padding: 0.2rem 0; }
.wpop footer a:hover { text-decoration: underline; }
.wpop .pic-credit { display: block; clear: both; margin-top: 0.45rem; font: 0.66rem var(--font-mono); color: var(--muted); text-decoration: none; }
.wpop .pic-credit:hover { color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.pager button { background: none; border: 0; color: var(--accent); font: 600 0.9rem var(--font-body); cursor: pointer; padding: 0.3rem 0; text-align: left; }
.pager button:last-child { text-align: right; }
.pager button:disabled { visibility: hidden; }

/* Map */
.map { grid-area: map; position: relative; overflow: hidden; overflow: clip; background: var(--map-bg); min-height: 0; cursor: grab; touch-action: none; }
.map.dragging { cursor: grabbing; }
.stage { position: absolute; left: 0; top: 0; width: 1800px; height: 1170px; transform-origin: 0 0; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; opacity: 0; transition: opacity 600ms ease; user-select: none; -webkit-user-drag: none; }
.stage img.on { opacity: 1; }
.stage img.relief.on { opacity: 0.55; mix-blend-mode: multiply; }
:root[data-theme="dark"] .stage img.on:not(.relief) { filter: brightness(0.82) contrast(1.05); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage img.on:not(.relief) { filter: brightness(0.82) contrast(1.05); } }
:root[data-theme="dark"] .stage img.relief.on { mix-blend-mode: normal; filter: invert(1); opacity: 0.6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage img.relief.on { mix-blend-mode: normal; filter: invert(1); opacity: 0.6; } }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#drawn { opacity: 0; transition: opacity 600ms ease; }
#drawn.on { opacity: 1; }
#drawn .bg { fill: var(--land); }
#drawn .upland { fill: var(--upland); }
#drawn .flood { fill: url(#marsh-pat); }
#drawn .wet { fill: var(--marsh-strong); opacity: 0.8; }
#drawn .lake { fill: var(--water); opacity: 0.75; }
#drawn .river { fill: none; stroke: var(--water); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#drawn .river.major { stroke-width: 5; }
#drawn .county { fill: none; stroke: var(--border); stroke-width: 4; stroke-dasharray: 14 6 3 6; }
#drawn .county-label { font: 600 22px var(--font-body); letter-spacing: 0.25em; text-transform: uppercase; fill: var(--border); opacity: 0.55; }
#drawn .vil circle { fill: var(--ink); }
#drawn .site path { fill: var(--site); stroke: var(--land); stroke-width: 2.5; }
#drawn .site.approx path { fill-opacity: 0.55; stroke-dasharray: 3 2; }
#drawn .note { font: italic 600 20px var(--font-body); fill: var(--muted); }
/* All map labels live in one layer so they can be placed against each other */
#labels { pointer-events: none; --halo: var(--panel); }
#labels.on-drawn { --halo: var(--land); }
#labels text { paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; }
#labels .l-pin text { font: 700 30px var(--font-display); fill: var(--ink); stroke-width: 6px; }
#labels .l-pin text.today { font: italic 400 22px var(--font-body); fill: var(--muted); }
#labels .l-vil text { font: italic 600 23px var(--font-display); fill: var(--ink); stroke-width: 5px; }
#labels .l-vil text.yr { font: 17px var(--font-mono); font-style: normal; fill: var(--muted); }
#labels .l-site text { font: 600 22px var(--font-body); fill: var(--site); stroke-width: 5px; }
.legend-map {
  position: absolute; left: 12px; top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.5rem; align-items: center;
  background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.5rem 0.7rem; font-size: 0.75rem; max-width: 15rem;
}
.legend-map svg { width: 1.6rem; height: 0.9rem; overflow: visible; }
.pin circle.dot { fill: var(--mark); stroke: var(--panel); stroke-width: 3; transition: r 200ms; }
.pin circle.ring { fill: none; stroke: var(--mark); stroke-width: 2.5; opacity: 0; }
.pin.has-events circle.ring { opacity: 0.55; }
.pin.hl circle.ring { opacity: 1; animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { from { r: 14; opacity: 1; } to { r: 34; opacity: 0; } }
.map-ui { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: flex; flex-direction: column; gap: 4px; }
.map-ui button { width: 2.1rem; height: 2.1rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; font-size: 1.1rem; cursor: pointer; }
.map-caption {
  position: absolute; left: 12px; bottom: 12px; max-width: min(34rem, calc(100% - 24px));
  background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.45rem 0.7rem; font-size: 0.8rem; line-height: 1.35;
}
.map-caption b { font-weight: 600; }
.map-caption small { display: block; color: var(--muted); font-size: 0.72rem; margin-top: 0.15rem; }
.scale { position: absolute; right: 12px; bottom: 14px; font: 0.7rem var(--font-mono); color: var(--ink); }
.scale div { height: 6px; border: 2px solid var(--ink); border-top: 0; margin-top: 2px; }

/* Landing page: a layer over the app; "Explore" slides it out left while the app slides in from the right */
.intro {
  position: fixed; inset: 0; z-index: 15; overflow-y: auto; background: var(--paper);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: center; gap: clamp(1.5rem, 4vw, 4rem);
  padding-block: max(2rem, env(safe-area-inset-top, 0px)) 2rem;

const MODERN = { sala: "Šaľa", galanta: "Galanta", matuskovo: "Matúškovo", sladkovicovo: "Sládkovičovo" };

// Map image covers EPSG:3857 bbox 1958000,6121000 – 2002000,6149600 at 1800×1170 px.
const BBOX = { x0: 1958000, y1: 6149600, w: 44000, h: 28600, pw: 1800, ph: 1170 };
function project([lon, lat]) {
  const x = lon * 20037508.34 / 180;
  const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) * 6378137;
  return [(x - BBOX.x0) / BBOX.w * BBOX.pw, (BBOX.y1 - y) / BBOX.h * BBOX.ph];

let lang = "sk";
try { const s = localStorage.getItem("sgm-lang"); if (s === "sk" || s === "en") lang = s; } catch (e) {}
let idx = 0;  // the story starts at the beginning
const fromHash = DATA.periods.findIndex(p => p.id.split("-")[0] === location.hash.slice(1));

  return ids.map(id => {
    const s = DATA.sources[id];
    if (!s) return `<span class="src">${esc(id)}</span>`;

  }).join("");
}

function renderTrack() {
  const track = document.getElementById("track");
  track.innerHTML = DATA.periods.map((p, i) =>
    `<button type="button" class="stop${p.researched ? "" : " draft"}" data-i="${i}" ${i === idx ? 'aria-current="true"' : ""}>

  track.querySelectorAll(".stop").forEach(b => b.addEventListener("click", () => go(+b.dataset.i)));

  if (cur) track.scrollTo({ left: cur.offsetLeft - track.offsetLeft - (track.clientWidth - cur.offsetWidth) / 2, behavior: renderTrack.done ? "smooth" : "auto" });

  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === DATA.periods.length - 1;
}

function censusRow(placeId, year) {
  const series = DATA.population[placeId] || [];
  const r = [...series].reverse().find(x => x.year <= year) || null;
  if (!r) return "";
  const hu = r.hu / r.total * 100, sk = r.sk / r.total * 100, ot = Math.max(0, 100 - hu - sk);
  const name = MODERN[placeId];
  return `<div class="row"><span>${esc(name)} <span class="conf">${r.year}</span></span>
    <div class="bar" title="${Math.round(hu)} % / ${Math.round(sk)} %"><span style="width:${hu}%;background:var(--hu)"></span><span style="width:${sk}%;background:var(--sk)"></span><span style="width:${ot}%"></span></div>

// --- Wikipedia links -------------------------------------------------------------
// Every mention of a known term becomes a link; the first one on a page is clearly dotted, the rest barely.
// One regex per language: all word forms of all terms, longest first, never inside a longer word.
let seenTerms = new Set();
const TERM_RE = {};
for (const lg of ["sk", "en"]) {
  const alts = [];
  // inner groups in the patterns become non-capturing, so group n always means alternative n
  DATA.terms.forEach(term => { if (DATA.wiki[term.id]) (term[lg] || []).forEach(pat => alts.push({ pat: pat.replace(/\((?!\?)/g, "(?:"), id: term.id })); });
  alts.sort((a, b) => b.pat.length - a.pat.length);
  TERM_RE[lg] = { re: new RegExp(`(?<![\\p{L}])(?:${alts.map(a => `(${a.pat})`).join("|")})(?![\\p{L}])`, "gu"), ids: alts.map(a => a.id) };
}
// On touch screens a term is not a real link: the artifact viewer opens link taps itself before our code
// can cancel them, so the term only opens the preview card and the card's button is the actual link.
const TOUCH = !matchMedia("(hover: hover) and (pointer: fine)").matches;
function linkTerms(text) {
  const { re, ids } = TERM_RE[lang];
  let out = "", last = 0;
  for (const m of text.matchAll(re)) {
    const g = m.slice(1).findIndex(v => v !== undefined);
    const id = ids[g], w = DATA.wiki[id][lang];
    const first = !seenTerms.has(id);
    seenTerms.add(id);
    out += esc(text.slice(last, m.index)) +
      (TOUCH
        ? `<span class="wl${first ? " first" : ""}" role="button" tabindex="0" aria-haspopup="dialog" data-term="${id}">${esc(m[0])}</span>`
        : `<a class="wl${first ? " first" : ""}" href="${esc(w.url)}" target="_blank" rel="noopener" data-term="${id}">${esc(m[0])}</a>`);
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

// Label placement: each label is measured, then tried at 8 positions around its marker.
// The position with the least overlap (other labels, all markers, fixed texts, map edge) wins;
// higher-priority labels are placed first, and optional labels that cannot fit cleanly are hidden.
const SLOTS = ["E", "NE", "SE", "W", "NW", "SW", "N", "S"];  // compass side of the marker, in preference order
function slotBox(slot, x, y, r, w, h) {
  const g = r + 4, d = g * 0.7;
  switch (slot) {
    case "E": return [x + g, y - h / 2];
    case "NE": return [x + d, y - h - d];
    case "SE": return [x + d, y + d];
    case "W": return [x - g - w, y - h / 2];
    case "NW": return [x - d - w, y - h - d];
    case "SW": return [x - d - w, y + d];
    case "N": return [x - w / 2, y - h - g];
    default: return [x - w / 2, y + g];
  }
}
const overlap = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
let labelState = null;
function placeLabels(layer, items, fixedEls) {
  layer.innerHTML = items.map((it, i) => `<g class="${it.cls}" data-i="${i}">${it.body}</g>`).join("");
  const groups = [...layer.children];
  items.forEach((it, i) => { const b = groups[i].getBBox(); it.bb = b; it.el = groups[i]; });
  const fixed = fixedEls.map(el => {
    // include the element's own transform (photo markers are translated and scaled groups)
    const b = el.getBBox(), m = el.transform && el.transform.baseVal.consolidate();
    const k = m ? m.matrix.a : 1, dx = m ? m.matrix.e : 0, dy = m ? m.matrix.f : 0;
    return [dx + b.x * k, dy + b.y * k, dx + (b.x + b.width) * k, dy + (b.y + b.height) * k];
  });
  labelState = { items, fixed };
  layoutLabels();
}
// Visible part of the map in map pixels, so labels avoid the screen edges too, not only the image edges
function visibleBox() {
  const r = mapEl.getBoundingClientRect();
  if (!r.width) return [0, 0, BBOX.pw, BBOX.ph];
  return [Math.max(0, -view.x / view.s), Math.max(0, -view.y / view.s),
          Math.min(BBOX.pw, (r.width - view.x) / view.s), Math.min(BBOX.ph, (r.height - view.y) / view.s)];
}
function layoutLabels() {
  if (!labelState) return;
  const { items, fixed } = labelState;
  // labels keep roughly the same size on screen, so zooming in frees room and more labels fit
  const k = Math.min(1.6, Math.max(0.5, 0.6 / view.s));
  const pad = 3 * k, frame = visibleBox();
  const markers = items.map(it => [it.x - it.r, it.y - it.r, it.x + it.r, it.y + it.r]);
  // panels floating over the map (legend, caption, buttons, scale) count as obstacles, converted to map pixels
  const mr = mapEl.getBoundingClientRect();
  const overlays = [...mapEl.querySelectorAll(".legend-map, .map-caption, .map-ui, .scale")]
    .filter(el => !el.hidden && el.offsetParent).map(el => {
      const r = el.getBoundingClientRect();
      return [(r.left - mr.left - view.x) / view.s, (r.top - mr.top - view.y) / view.s,
              (r.right - mr.left - view.x) / view.s, (r.bottom - mr.top - view.y) / view.s];
    });
  const placed = fixed.concat(overlays);
  [...items.keys()].sort((a, b) => items[b].prio - items[a].prio).forEach(i => {
    const it = items[i], w = it.bb.width * k + pad * 2, h = it.bb.height * k + pad * 2;
    let best = null;
    SLOTS.forEach((slot, k) => {
      const [bx, by] = slotBox(slot, it.x, it.y, it.r, w, h);
      const box = [bx, by, bx + w, by + h];
      let clash = 0;
      placed.forEach(p => { clash += overlap(box, p) * 3; });
      markers.forEach((m, j) => { if (j !== i) clash += overlap(box, m) * 4; });
      clash += (w * h - overlap(box, frame)) * 5;
      const cost = clash + k * 25;
      if (!best || cost < best.cost) best = { cost, clash, box };
    });
    const offscreen = it.x < frame[0] || it.x > frame[2] || it.y < frame[1] || it.y > frame[3];
    // towns always show; other labels give way when their marker is out of view or they would collide too much
    const tolerance = it.prio >= 3 ? Infinity : it.optional ? 0.08 : 0.35;
    if (it.prio < 3 && (offscreen || best.clash > w * h * tolerance)) { it.el.setAttribute("display", "none"); return; }
    it.el.removeAttribute("display");
    placed.push(best.box);
    it.el.setAttribute("transform", `translate(${(best.box[0] + pad - it.bb.x * k).toFixed(1)},${(best.box[1] + pad - it.bb.y * k).toFixed(1)}) scale(${k.toFixed(3)})`);
  });
}

// --- Picture loading ---------------------------------------------------------------
// Each ".ld" container shows a spinner until its picture has fully loaded, then fades the picture in.
function watchImg(box) {
  const img = box.querySelector("img");
  if (!img) return;
  const done = () => box.classList.add("ready");
  if (img.complete && img.naturalWidth) { done(); return; }  // already cached: no spinner
  box.classList.remove("ready");
  img.addEventListener("load", done, { once: true });
  img.addEventListener("error", done, { once: true });  // never leave a spinner turning forever
}
const prepImages = root => root.querySelectorAll(".ld:not(.ready)").forEach(watchImg);

// --- Pictures ----------------------------------------------------------------------
const periodPics = p => DATA.images.filter(i => i.period === p.id).sort((a, b) => (b.cover ? 1 : 0) - (a.cover ? 1 : 0));
const HUNGARICANA = { // postcards we may not republish: link to them instead
  "p13-austria-hungary": ["Vágsellye", "Galánta", "Diószeg"], "p14-first-republic": ["Vágsellye", "Galánta", "Diószeg"], "p15-vienna-award-ww2": ["Vágsellye", "Galánta", "Diószeg"] };
function picTag(pic) {
  const k = UI[lang].kinds;
  let tag = pic.dated ? `${k.historic} · ${pic.dated}` : pic.kind === "photo" || pic.kind === "building" ? k.today : k[pic.kind] || "";
  if (pic.elsewhere) tag += ` · ${k.elsewhere}`;
  return tag;
}
function galleryHead(p, pics) {
  if (!pics.length) return "";
  const [c, ...rest] = pics, u = UI[lang];
  const more = HUNGARICANA[p.id] ? `<div class="strip-more">${esc(u.kinds.more)}: ${HUNGARICANA[p.id].map(q =>
    `<a href="https://gallery.hungaricana.hu/en/search/results/?query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(q)}</a>`).join(" · ")}</div>` : "";
  return `<div><figure class="cover ld${c.kind === "ai" ? " ai" : ""}" data-img="${c.id}"><img src="img/${c.id}.jpg" alt="${esc(t(c.caption))}">

    ${rest.length ? `<div class="strip">${rest.map(r => `<button type="button" class="ld sm${r.kind === "ai" ? " ai" : ""}" data-img="${r.id}" aria-label="${esc(t(r.caption))}"><img src="img/${r.id}_t.jpg" alt="" loading="lazy"></button>`).join("")}</div>` : ""}${more}</div>`;

function evThumb(eventId, pics) {

// map markers for pictures with a known place; pictures from the same spot fan out around it
function photoPins(p) {
  const groups = {};
  return periodPics(p).filter(i => i.coords).map(i => {
    const [x, y] = project(i.coords), key = `${Math.round(x / 20)},${Math.round(y / 20)}`;
    const n = groups[key] = (groups[key] || 0) + 1, a = (n - 1) * 1.1, r = n > 1 ? 46 : 0;
    const px = x + 40 + Math.cos(a) * r, py = y - 40 + Math.sin(a) * r;
    return `<g class="photo-pin" data-img="${i.id}" transform="translate(${px.toFixed(1)},${py.toFixed(1)}) scale(1.6)"><title>${esc(t(i.caption))}</title>
      <circle r="15"></circle><path d="M-8,-4h4l2,-3h4l2,3h4v11h-16z"></path><circle class="lens" r="3.2" cy="1.6" style="fill:var(--panel);stroke:none"></circle></g>`;
  }).join("");
}

// Pan & zoom
const mapEl = document.getElementById("map"), stage = document.getElementById("stage");
let view = { s: 1, x: 0, y: 0 }, minS = 0.3;
function fit() {
  const r = mapEl.getBoundingClientRect();
  // start covering the view, but zoom out further if needed so all three towns fit
  const pts = DATA.places.filter(p => p.role === "core" && p.coords).map(p => project(p.coords));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const cover = Math.max(r.width / BBOX.pw, r.height / BBOX.ph);
  const fitTowns = Math.min(r.width * 0.86 / (Math.max(...xs) - Math.min(...xs) + 1), r.height * 0.8 / (Math.max(...ys) - Math.min(...ys) + 1));
  minS = Math.min(cover, fitTowns, Math.min(r.width / BBOX.pw, r.height / BBOX.ph));
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  view.s = Math.min(cover, fitTowns); view.x = r.width / 2 - cx * view.s; view.y = r.height / 2 - cy * view.s; apply();
}
function clamp() {
  const r = mapEl.getBoundingClientRect();
  view.s = Math.min(Math.max(view.s, minS), 3);
  const w = BBOX.pw * view.s, h = BBOX.ph * view.s;
  view.x = w < r.width ? (r.width - w) / 2 : Math.min(0, Math.max(r.width - w, view.x));
  view.y = h < r.height ? (r.height - h) / 2 : Math.min(0, Math.max(r.height - h, view.y));
}
function apply() {
  clamp();
  stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  // scale bar: metres per screen px at this latitude (~48.17°)
  const mPerPx = BBOX.w / BBOX.pw / view.s * Math.cos(48.17 * Math.PI / 180);
  const km = [1, 2, 5, 10].find(k => k * 1000 / mPerPx > 70) || 10;
  document.getElementById("scale-bar").style.width = (km * 1000 / mPerPx) + "px";
  document.getElementById("scale-label").textContent = km + " km";

  apply.t = setTimeout(layoutLabels, 120);  // re-place labels for the new visible area once panning/zooming pauses
}
function zoomAt(f, cx, cy) {
  const r = mapEl.getBoundingClientRect();

  const ns = Math.min(Math.max(view.s * f, minS), 3); const k = ns / view.s;

mapEl.addEventListener("wheel", e => { e.preventDefault(); const r = mapEl.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
// Drag with one pointer, pinch-zoom with two (touch)
const pointers = new Map();
let drag = null, pinch = null;
const pinchState = () => {
  const [a, b] = [...pointers.values()], r = mapEl.getBoundingClientRect();

mapEl.addEventListener("pointerdown", e => {
  if (e.target.closest(".map-ui, .map-caption, .legend-map")) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { mapEl.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone; dragging still works without capture */ }
  if (pointers.size === 2) { drag = null; pinch = pinchState(); }

  if (!pointers.has(e.pointerId)) return;

    const now = pinchState();
    zoomAt(now.d / pinch.d, now.cx, now.cy);
    view.x += now.cx - pinch.cx; view.y += now.cy - pinch.cy; apply();
    pinch = now;

});

    drag = null; mapEl.classList.remove("dragging");
  }
};
